name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out de repo
      - uses: actions/checkout@v4

      # 2) SSH-key instellen
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "${{ secrets.VPS_SSH_KEY_B64 }}" | tr -d '\r' | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 2200 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # 3) (optioneel) Docker-build als sanity check
      - name: Build Docker image (sanity)
        run: docker build . -t vhm-wordpress

      # 4) Maak wp-content-dirs aan en zet juiste rechten
      - name: Ensure remote wp-content dirs
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa -p 2200 \
            vsm@${{ secrets.VPS_HOST }} sudo bash -eux << 'ENDSSH'
              mkdir -p /home/vhm/public_html/wp-content/{plugins,themes,uploads}
              mkdir -p /home/vhm/public_html/wp-content/plugins/hardloop-manager/migrations
              chown -R vsm:vsm /home/vhm/public_html/wp-content
              chmod -R 775     /home/vhm/public_html/wp-content
            ENDSSH

      # 5) Rsync wp-content
      - name: Rsync wp-content to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -p 2200" \
            ./wp-content/ \
            vsm@${{ secrets.VPS_HOST }}:/home/vhm/public_html/wp-content/

      # 6) Rsync alleen de migrations (optioneel, kan samengevoegd worden)
      - name: Rsync migrations to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -p 2200" \
            ./wp-content/plugins/hardloop-manager/migrations/ \
            vsm@${{ secrets.VPS_HOST }}:/home/vhm/public_html/wp-content/plugins/hardloop-manager/migrations/

      # 7) WP-CLI taken op de server uitvoeren
      - name: Run WP-CLI tasks on VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa -p 2200 \
            vsm@${{ secrets.VPS_HOST }} bash -eux << 'ENDSSH'
              cd /home/vhm/public_html
              wp plugin activate hardloop-manager --allow-root || true
              wp rewrite flush --hard   --allow-root
              wp option delete hardloop_manager_imported_gac --allow-root || true
              wp eval-file wp-content/plugins/hardloop-manager/migrations/2025-05-02-import-gac-hardlopers.php --allow-root
            ENDSSH