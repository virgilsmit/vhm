name: Deploy to VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'plugins/**'
      - 'themes/**'
      - 'uploads/**'
      - '.github/workflows/deploy.yml'
      - 'plugins/hardloop-manager/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key and known_hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode Base64-encoded private key into id_rsa
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Scan and trust VPS host key on port 2200
          ssh-keyscan -p 2200 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ensure local folders for rsync
        run: |
          mkdir -p plugins
          mkdir -p themes
          mkdir -p uploads
          mkdir -p plugins/hardloop-manager/migrations

      - name: Ensure remote wp-content directories
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p 2200 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash << 'ENDSSH'
            set -e
            mkdir -p /home/vhm/public_html/wp-content/plugins
            mkdir -p /home/vhm/public_html/wp-content/themes
            mkdir -p /home/vhm/public_html/wp-content/uploads
            mkdir -p /home/vhm/public_html/wp-content/plugins/hardloop-manager/migrations
            chown -R vsm:vsm /home/vhm/public_html/wp-content
            chmod -R 775 /home/vhm/public_html/wp-content
          ENDSSH

      - name: Rsync wp-content to VPS
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p 2200" \
            ./plugins/ \
            ./themes/ \
            ./uploads/ \
            ./plugins/hardloop-manager/migrations/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/vhm/public_html/wp-content/

      - name: Flush cache & rewrite on VPS
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p 2200 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/vhm/public_html && wp cache flush --allow-root && wp rewrite flush --hard --allow-root"

  db-migrate:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ contains(join(github.event.head_commit.modified,','), 'plugins/hardloop-manager/migrations/') || contains(join(github.event.head_commit.added,','), 'plugins/hardloop-manager/migrations/') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key and known_hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p 2200 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run DB migrations on VPS
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p 2200 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash << EOF
            set -euo pipefail
            cd /home/vhm/public_html

            echo " - Applying SQL migrations…"
            for f in plugins/hardloop-manager/migrations/*.sql; do
              if [ -f "\$f" ]; then
                echo "   > \$f"
                wp db query "\$(cat \"\$f\")" --allow-root
              fi
            done

            echo " - Applying PHP migrations…"
            for f in plugins/hardloop-manager/migrations/*.php; do
              if [ -f "\$f" ]; then
                echo "   > \$f"
                wp eval-file "\$f" --allow-root
              fi
            done

            echo "✅ Migrations complete."
          EOF
