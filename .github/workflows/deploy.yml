name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # … je bestaande stappen: checkout, SSH-key, rsync, migrations, etc.

      # ———————————————————————
      # Nieuwe stap: exporteer hardlopers als WXR
      - name: Export hardlopers to XML
        run: |
          cd wp-content/plugins/hardloop-manager/../../  # zorg dat je in WP-root zit
          wp export --post_type=hardloper --filename_format=hardlopers.xml

      # Kopieer het XML-bestand naar de VPS en importeer het daar
      - name: Import hardlopers on VPS
        run: |
          scp -i ~/.ssh/id_rsa -P 2200 hardlopers.xml \
            vsm@${{ secrets.VPS_HOST }}:/home/vhm/public_html/
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -p 2200 \
            vsm@${{ secrets.VPS_HOST }} << 'EOF'
          cd /home/vhm/public_html
          # (optioneel) installeer WP Importer als het nog niet bestaat
          wp plugin is-installed wordpress-importer --allow-root || \
            wp plugin install wordpress-importer --activate --allow-root
          wp import hardlopers.xml --authors=create --allow-root
          rm hardlopers.xml
          EOF